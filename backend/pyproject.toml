[project]
name = "adventure-planner"
version = "0.1.0"
description = "AgenticRAG-Abenteuerplaner (FastAPI + LangGraph + PydanticAI + pgvector)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pgvector>=0.5",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.16",
    "pydantic-ai-slim[openai]>=2.61",
    "langgraph>=1.2",
    "langfuse>=5.0.4",
    "pwdlib[argon2]>=0.3",
    "pyjwt>=2.15",
    "httpx>=0.28",
    "python-dotenv",
    "python-multipart",
    "pypdf",
    "fpdf2>=2.8",
    "pillow",
    "astral>=3.2",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "respx>=0.23", "ruff==0.17.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "ASYNC", "DTZ", "RUF"]
# Umlaute und typografische Zeichen (–, „“, …) sind in den deutschen Texten gewollt
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# conftest.py setzt Umgebungsvariablen, bevor die App importiert wird
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
