name: Frontend

# Installiert die Abhängigkeiten exakt nach package-lock.json, prüft mit Biome (Lint + Formatierung)
# und baut das Frontend (Typprüfung mit tsc + Vite-Build)
on:
  push:
    paths: &paths
      - frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    paths: *paths

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      # biome ci schreibt nichts um und meldet Fehler als GitHub-Annotationen
      - name: Lint und Formatierung prüfen
        run: npx biome ci --reporter=github .
      - name: Bauen
        run: npm run build
