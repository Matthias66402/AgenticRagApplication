name: Frontend

# Installiert die Abhängigkeiten exakt nach package-lock.json und baut das Frontend (Typprüfung mit tsc + Vite-Build)
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Bauen
        run: npm run build
