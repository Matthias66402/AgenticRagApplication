name: Docker

# Baut das Backend-Image, startet die Compose-Umgebung mit .env.example und führt darin die Tests aus.
# Die Tests rufen kein echtes LLM auf, ein API-Key ist daher nicht nötig.
on:
  push:
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .env aus der Vorlage anlegen
        run: cp .env.example .env
      - name: Image bauen und starten
        run: docker compose up -d --build --wait
      - name: Datenbanken migrieren
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend sh -c 'ALEMBIC_DATABASE_URL=$TEST_DATABASE_URL alembic upgrade head'
      - name: Backend antwortet
        run: curl --fail --silent --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8010/api/health
      - name: Tests
        run: docker compose exec -T backend pytest -q
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs
      - name: Aufräumen
        if: always()
        run: docker compose down -v
